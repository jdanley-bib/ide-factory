name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx openspec validate --all

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx secretlint "**/*"

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install pinned Semgrep
        run: |
          set -euo pipefail
          semgrep_git_sha=240da9f30cd06fb4ee00c2c31c114c1c1f5ee0f4 # v1.182.0
          semgrep_wheel_sha256=19a82868830389c039bb71bfc0aeebb28385e5b65740120710eff050324ad14f
          wheel_name=semgrep-1.182.0-cp310.cp311.cp312.cp313.cp314.py310.py311.py312.py313.py314-none-manylinux_2_34_x86_64.whl
          dest="${RUNNER_TEMP}/semgrep-pin"
          mkdir -p "$dest"
          python -m pip download --no-deps --only-binary=:all: "semgrep==1.182.0" -d "$dest"
          wheel="${dest}/${wheel_name}"
          echo "${semgrep_wheel_sha256}  ${wheel}" | sha256sum -c -
          python -m pip install "$wheel"
          printf 'semgrep-release-sha %s\n' "$semgrep_git_sha"
      - run: node scripts/run-semgrep.mjs
