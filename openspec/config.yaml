schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  This repository is the IDE-native software factory.
  The human defines what to build by authoring an OpenSpec change. Do not invent products from the web.
  The IDE session model (Cursor, GitHub Copilot, or Claude Code) does the work. Do not specify Ollama, a local model server, or a model HTTP API.
  Backlog.md is the only execution queue. Team memory lives in .factory/ and is not a second task tracker.
  Installing into a project must preserve existing decisions, agent histories, and unrelated files.

rules:
  proposal:
    - State what is out of scope, including autonomous ideation and Ollama
  tasks:
    - Each checkbox must say how to verify it
    - Do not add a task that launches a model or researches the web for ideas
